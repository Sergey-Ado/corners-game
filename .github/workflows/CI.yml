name: Test Corners App
on: workflow_dispatch
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v7

      - name: Cache turbo build setup
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm i

      - name: Build application
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Get repository
        uses: actions/checkout@v7

      - name: Cache turbo build setup
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm i

      - name: Build application
        run: npm run build

  coverage:
    runs-on: ubuntu-latest
    needs: lint

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Get repository
        uses: actions/checkout@v7

      - name: Cache turbo build setup
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm i

      - name: Run coverage
        run: npm run coverage

      - name: Report client coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./apps/client
