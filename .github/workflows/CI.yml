name: Test Corners App
on: workflow_dispatch
jobs:
  coverage:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Get repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm i

      - name: Run coverage
        run: npm run coverage

      - name: Report client coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./apps/client

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm i

      - name: Build application
        run: npm run build

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm i

      - name: Build application
        run: npm run build
